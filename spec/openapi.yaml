openapi: 3.1.0
info:
  title: PolicySQL HTTP API
  version: 1.0.0
  description: >-
    Hosting-independent public and commit-check callback contracts for PolicySQL.
    Bytes parameters and result cells use canonical padded standard base64 strings
    (empty bytes are an empty string; SQL NULL in a nullable result cell is JSON null).
    The compiler determines the expected type. Arrays and database-driver objects are
    not bytes encodings. Ordinary string and JSON values retain their own meanings.
    For a named parameter of any type, bytes included, JSON null binds SQL NULL only
    when every use of that parameter is a direct INSERT VALUES / UPDATE SET assignment
    to a Catalog column declared nullable; Explain reports exactly this as the
    parameter descriptor's `nullable`. Any other JSON null parameter is rejected
    with POLICYSQL_INVALID_PARAMETER.
servers:
  - url: https://gateway.example.com
security:
  - deployment: []
paths:
  /v1/catalog:
    get:
      operationId: getCatalog
      description: Requires session access `catalog`.
      parameters:
        - $ref: '#/components/parameters/Role'
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Role-visible logical Catalog.
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: './schemas/catalog.schema.json'
        '304':
          description: Catalog has not changed.
        default:
          $ref: '#/components/responses/Error'
  /v1/capabilities:
    get:
      operationId: getCapabilities
      description: Requires session access `catalog`.
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Deployment SQL features and enforced limits.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '304':
          description: Capabilities have not changed.
        default:
          $ref: '#/components/responses/Error'
  /v1/transactions:execute:
    post:
      operationId: executeAtomicTransaction
      description: Requires session access `execute`. Optional exact egress SQL additionally requires deployment enablement and session access `debug`.
      parameters:
        - $ref: '#/components/parameters/Role'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/atomic-execute.schema.json'
      responses:
        '200':
          description: Committed atomic transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtomicExecuteResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/transactions:explain:
    post:
      operationId: explainAtomicTransaction
      description: Requires session access `explain`. Compiles statements and infers parameter and result types without execution.
      parameters:
        - $ref: '#/components/parameters/Role'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/atomic-execute.schema.json'
      responses:
        '200':
          description: Compiled explanation for every statement without database execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/transactions:
    post:
      operationId: beginTransaction
      description: Requires session access `execute`.
      parameters:
        - $ref: '#/components/parameters/Role'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginTransactionRequest'
      responses:
        '201':
          description: New or idempotently recovered interactive transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionState'
        default:
          $ref: '#/components/responses/Error'
  /v1/transactions/{transactionId}/statements:
    post:
      operationId: executeTransactionStatement
      description: Requires session access `execute` and the transaction's immutable session fingerprint.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/Role'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SequencedSqlRequest'
      responses:
        '200':
          description: Statement result and next sequence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionStatementResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/transactions/{transactionId}/commit:
    post:
      operationId: commitTransaction
      description: >-
        Requires session access `execute` and the transaction's immutable session fingerprint.
        Repeating the identical commit command replays its recorded terminal response. When
        COMMIT may have been sent but its outcome is not recorded (the transaction owner was
        lost, its record could not be stored, or the database connection failed during
        COMMIT), the commit and every repetition of it answer 503
        POLICYSQL_COMMIT_OUTCOME_UNKNOWN. That code is never a rejection: the transaction may
        have committed. A 409 answers only a commit whose COMMIT was never sent. The
        wrapper's authentication and the session gate run before the transaction owner; a
        commit they deny (401 from the wrapper, or 403 POLICYSQL_FORBIDDEN_ACCESS) is the
        intentional exception to this rule (ADR 0007, amendment #104). It stops the
        transaction without consulting the owner's commit record and is not proof that an
        earlier COMMIT did not apply.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/Role'
      requestBody:
        $ref: '#/components/requestBodies/SequenceCommand'
      responses:
        '200':
          description: Terminal transaction state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionState'
        '503':
          description: >-
            POLICYSQL_COMMIT_OUTCOME_UNKNOWN (the commit outcome is unknown and the
            transaction may have committed), or another temporary dependency failure such as
            POLICYSQL_DATABASE_UNAVAILABLE. Neither is a rejection of the commit.
          headers:
            PolicySQL-Request-Id: { schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          $ref: '#/components/responses/Error'
  /v1/transactions/{transactionId}/rollback:
    post:
      operationId: rollbackTransaction
      description: Requires session access `execute` and the transaction's immutable session fingerprint.
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/Role'
      requestBody:
        $ref: '#/components/requestBodies/SequenceCommand'
      responses:
        '200':
          description: Terminal transaction state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionState'
        default:
          $ref: '#/components/responses/Error'
  /v1/commit-checks/{validationId}/query:
    post:
      operationId: executeCommitCheckQuery
      security:
        - callbackCapability: []
      parameters:
        - name: validationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackQueryRequest'
      responses:
        '200':
          description: Callback SELECT result from the owned transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackQueryResponse'
        default:
          $ref: '#/components/responses/Error'
webhooks:
  commitCheck:
    post:
      operationId: receiveCommitCheck
      security: []
      parameters:
        - name: PolicySQL-Hook-Version
          in: header
          required: true
          schema: { const: '1' }
        - name: PolicySQL-Hook-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]+$' }
        - name: PolicySQL-Hook-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^v1=[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitCheckHookRequest'
      responses:
        '200':
          description: Validator decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitCheckDecision'
components:
  securitySchemes:
    deployment:
      type: http
      scheme: bearer
      description: >-
        Deployment-defined authentication. The deployment's wrapper authenticates every
        client request, including every interactive command and commit, and passes the
        resulting trusted session to PolicySQL; PolicySQL never sees the credential.
        Credential failures are returned by the wrapper, never by PolicySQL: 401
        POLICYSQL_UNAUTHENTICATED for a missing or invalid credential (the only code the
        reference wrapper uses), or the reserved 401 POLICYSQL_AUTHENTICATION_FAILED, which a
        custom wrapper may use when a present credential failed verification. Clients treat
        both as not executed. Required access and
        PolicySQL-Role selection are checked by PolicySQL against the trusted session
        (403 POLICYSQL_FORBIDDEN_ACCESS). For an interactive commit retry, a 401 or 403 is
        the documented exception to the commit-retry rule (ADR 0007, amendment #104): the
        request was not executed, but an earlier identical commit may have completed, so the
        rejection is not proof that it did not. The reference wrapper uses a bearer JWT with
        the PolicySQL JWT profile (ADR 0020); other deployments may use any scheme.
    callbackCapability:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Role:
      name: PolicySQL-Role
      in: header
      required: false
      schema: { $ref: '#/components/schemas/Identifier' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional replay key for atomic mutations and interactive transaction start.
        Atomic mutations with a key require policysql_idempotency in the selected database;
        lookup and response storage remain in the mutation transaction. Without a key,
        this table is never accessed and each request is a new execution. Interactive
        start without a key creates a new transaction; subsequent commands retain their
        sequence-based retry rules. Empty or malformed keys are rejected with 400
        POLICYSQL_IDEMPOTENCY_KEY_INVALID before any database work. A key is 16-128 ASCII characters
        from letters, digits and `. _ : - + / =` (base64 keys are accepted unchanged). Read-only
        atomic execution does not use idempotency storage. A stored reply is replayed while
        retained; a deployment may delete old rows administratively, and no retention duration
        is advertised in Capabilities.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:+/=-]{16,128}$' }
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  requestBodies:
    SequenceCommand:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [sequence]
            properties:
              sequence: { type: integer, minimum: 1 }
  responses:
    Error:
      description: >-
        Request failed without exposing protected SQL or hidden metadata. Each error code
        has exactly one HTTP status; the table in website/api/errors.md is canonical and the
        library's HTTP adapter implements exactly that table (ADR 0023). A code outside it is
        served as 500. Request-rate limiting is a wrapper responsibility: the wrapper in front
        of the library may answer 429 POLICYSQL_RATE_LIMITED in this same shape before the
        library runs.
      headers:
        PolicySQL-Request-Id: { schema: { type: string } }
        Retry-After:
          description: >-
            Never set by the PolicySQL library. A wrapper may set it on the 429
            POLICYSQL_RATE_LIMITED responses it emits before the library runs; the
            reference wrapper sends the rate-limit period in seconds.
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Identifier:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
    JsonValue: {}
    Parameters:
      type: object
      description: >-
        Named client parameters. JSON null is accepted (as SQL NULL) only for a
        parameter whose Explain descriptor reports `nullable: true`.
      additionalProperties:
        $ref: '#/components/schemas/JsonValue'
    SnapshotExpectation:
      type: object
      additionalProperties: false
      required: [schemaVersion, policyVersion]
      properties:
        schemaVersion: { type: string, minLength: 1 }
        policyVersion: { type: string, minLength: 1 }
    SequencedSqlRequest:
      type: object
      additionalProperties: false
      required: [sequence, sql, params]
      properties:
        sequence: { type: integer, minimum: 1 }
        sql: { type: string, minLength: 1 }
        params: { $ref: '#/components/schemas/Parameters' }
        expect: { $ref: '#/components/schemas/Expectation' }
    CallbackQueryRequest:
      type: object
      additionalProperties: false
      required: [sequence, sql, params]
      properties:
        sequence: { type: integer, minimum: 1 }
        sql: { type: string, minLength: 1 }
        params: { $ref: '#/components/schemas/Parameters' }
    Expectation:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        affectedRows: { type: integer, minimum: 0 }
        rowCount: { type: integer, minimum: 0 }
    ResultColumn:
      type: object
      additionalProperties: false
      required: [name, type, representation, nullable]
      properties:
        name: { type: string, minLength: 1 }
        type:
          oneOf:
            - { $ref: '#/components/schemas/Identifier' }
            - type: array
              minItems: 2
              uniqueItems: true
              items: { $ref: '#/components/schemas/Identifier' }
        representation: { enum: [string, number, boolean, object, array] }
        format: { $ref: '#/components/schemas/Identifier' }
        constraints: { type: object }
        jsonSchema: { type: object }
        nullable: { type: boolean }
    ParameterDescriptor:
      type: object
      additionalProperties: false
      required: [name, type, representation, nullable]
      properties:
        name: { $ref: '#/components/schemas/Identifier' }
        type: { $ref: '#/components/schemas/Identifier' }
        representation: { enum: [string, number, boolean, object, array] }
        format: { $ref: '#/components/schemas/Identifier' }
        nullable:
          type: boolean
          description: >-
            Statement-wide compiler proof, independent of any supplied sample: true
            only when every use is a direct INSERT/UPDATE assignment to a nullable
            Catalog column. Execute accepts JSON null for exactly these parameters.
        constraints: { type: object }
    CompileResultDescriptor:
      type: object
      additionalProperties: false
      required: [columns]
      properties:
        columns: { type: array, items: { $ref: '#/components/schemas/ResultColumn' } }
    Redaction:
      type: object
      additionalProperties: false
      required: [row, column, code]
      properties:
        row: { type: integer, minimum: 0 }
        column: { type: string, minLength: 1 }
        code: { const: POLICY_REDACTED }
    ResultMeta:
      type: object
      additionalProperties: false
      required: [columns, redactions]
      properties:
        columns: { type: array, items: { $ref: '#/components/schemas/ResultColumn' } }
        redactions: { type: array, items: { $ref: '#/components/schemas/Redaction' } }
    SqlMeta:
      type: object
      additionalProperties: false
      required: [requestId, policyVersion, schemaVersion, role, operation, result]
      properties:
        requestId: { type: string, minLength: 1 }
        policyVersion: { type: string, minLength: 1 }
        schemaVersion: { type: string, minLength: 1 }
        role: { $ref: '#/components/schemas/Identifier' }
        operation: { enum: [select, insert, update, delete] }
        result: { $ref: '#/components/schemas/ResultMeta' }
        mutation: { type: object }
    StatementMeta:
      type: object
      additionalProperties: false
      required: [operation, result]
      properties:
        operation: { enum: [select, insert, update, delete] }
        result: { $ref: '#/components/schemas/ResultMeta' }
        mutation: { type: object }
    StatementResult:
      type: object
      additionalProperties: false
      required: [columns, rows, rowCount, meta]
      properties:
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: object } }
        rowCount: { type: integer, minimum: 0 }
        affectedRows: { type: integer, minimum: 0 }
        meta: { $ref: '#/components/schemas/StatementMeta' }
    TransactionMeta:
      type: object
      additionalProperties: false
      required: [requestId, policyVersion, schemaVersion, role, commitChecks]
      properties:
        requestId: { type: string, minLength: 1 }
        policyVersion: { type: string, minLength: 1 }
        schemaVersion: { type: string, minLength: 1 }
        role: { $ref: '#/components/schemas/Identifier' }
        commitChecks: { enum: [not_triggered, passed] }
    AtomicExecuteResponse:
      type: object
      additionalProperties: false
      required: [transactionId, status, results, meta]
      properties:
        transactionId: { type: string }
        status: { const: committed }
        results: { type: array, minItems: 1, items: { $ref: '#/components/schemas/StatementResult' } }
        meta: { $ref: '#/components/schemas/TransactionMeta' }
        debug: { $ref: '#/components/schemas/DeveloperDebug' }
    ExecutionTraceParameter:
      type: object
      additionalProperties: false
      required: [name, source, value]
      properties:
        name: { type: string, minLength: 1 }
        source: { enum: [client, server] }
        value: { const: '[redacted]' }
    ExecutionTraceStatement:
      type: object
      additionalProperties: false
      required: [index, operation, inputSql, executedSql, parameters]
      properties:
        index: { type: integer, minimum: 0 }
        operation: { enum: [select, insert, update, delete] }
        resource: { type: string, minLength: 1 }
        inputSql: { type: string, minLength: 1 }
        executedSql: { type: string, minLength: 1 }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/ExecutionTraceParameter' }
    ExecutionTrace:
      type: object
      additionalProperties: false
      required: [source, requestId, disposition, attempt, statements]
      properties:
        source: { const: turso-egress }
        requestId: { type: string, minLength: 1 }
        disposition: { enum: [executed, idempotency_replay] }
        attempt: { const: 1 }
        statements:
          type: array
          items: { $ref: '#/components/schemas/ExecutionTraceStatement' }
    DeveloperDebug:
      type: object
      additionalProperties: false
      required: [executionTrace]
      properties:
        executionTrace: { $ref: '#/components/schemas/ExecutionTrace' }
    BeginTransactionRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: { enum: [read, write] }
        expected: { $ref: '#/components/schemas/SnapshotExpectation' }
    TransactionState:
      type: object
      required: [transactionId, status]
      properties:
        transactionId: { type: string }
        status: { enum: [active, validating, committed, rolled_back, failed, expired] }
        nextSequence: { type: integer, minimum: 1 }
        expiresAt: { type: string, format: date-time }
        meta: { type: object }
    TransactionStatementResponse:
      type: object
      required: [transactionId, status, nextSequence, result, meta]
      properties:
        transactionId: { type: string }
        status: { const: active }
        nextSequence: { type: integer, minimum: 1 }
        result: { $ref: '#/components/schemas/StatementResult' }
        meta: { type: object }
    CallbackQueryResponse:
      type: object
      additionalProperties: false
      required: [sequence, columns, rows, rowCount, meta]
      properties:
        sequence: { type: integer, minimum: 1 }
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: object } }
        rowCount: { type: integer, minimum: 0 }
        meta: { $ref: '#/components/schemas/SqlMeta' }
    CommitCheckHookRequest:
      type: object
      additionalProperties: false
      required: [version, validationId, check, requestId, policyVersion, schemaVersion, role, session, statements, query]
      properties:
        version: { const: '1' }
        validationId: { type: string, minLength: 1 }
        check: { $ref: '#/components/schemas/Identifier' }
        requestId: { type: string, minLength: 1 }
        policyVersion: { type: string, minLength: 1 }
        schemaVersion: { type: string, minLength: 1 }
        role: { $ref: '#/components/schemas/Identifier' }
        session:
          type: object
          additionalProperties: { type: string }
        statements:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [index, type, resource]
            properties:
              index: { type: integer, minimum: 0 }
              type: { enum: [insert, update, delete] }
              resource: { $ref: '#/components/schemas/Identifier' }
        query:
          type: object
          additionalProperties: false
          required: [url, token, expiresAt]
          properties:
            url: { type: string, format: uri }
            token: { type: string, minLength: 32 }
            expiresAt: { type: string, format: date-time }
    CommitCheckDecision:
      type: object
      additionalProperties: false
      required: [version, allowed]
      properties:
        version: { const: '1' }
        allowed: { type: boolean }
        error:
          type: object
          additionalProperties: false
          required: [code]
          properties:
            code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
    ExplainResponse:
      type: object
      additionalProperties: false
      required: [statements, meta]
      properties:
        statements:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [index, operation, parameters, result, resources, serverParameters, warnings]
            properties:
              index: { type: integer, minimum: 0 }
              operation: { enum: [select, insert, update, delete] }
              parameters: { type: array, items: { $ref: '#/components/schemas/ParameterDescriptor' } }
              result: { $ref: '#/components/schemas/CompileResultDescriptor' }
              resources: { type: array, items: { type: object } }
              effectiveLimit: { type: [integer, 'null'], minimum: 1 }
              serverParameters: { type: array, items: { type: string } }
              warnings: { type: array, items: { type: string } }
        meta:
          type: object
          additionalProperties: false
          required: [requestId, policyVersion, schemaVersion, role, transactionMode]
          properties:
            requestId: { type: string }
            policyVersion: { type: string }
            schemaVersion: { type: string }
            role: { $ref: '#/components/schemas/Identifier' }
            transactionMode: { enum: [read, write] }
    Capabilities:
      type: object
      additionalProperties: true
      required: [sqlDialect, statements, limits, transactions, idempotency]
      properties:
        sqlDialect: { const: sqlite }
        statements: { type: array, items: { enum: [select, insert, update, delete] } }
        limits:
          type: object
          additionalProperties: true
          properties:
            maxBytesPerValue:
              type: integer
              minimum: 1
              description: Maximum decoded bytes of one bytes value (a bytes parameter, a policy preset, a result cell); text and JSON values are not bounded by it. The default is 262144 and the deployment may configure up to 1048576. An upper bound only, not a promise; the smallest applicable limit governs, so a value within it can still be refused by maxRequestBytes (413 POLICYSQL_REQUEST_TOO_LARGE, or 500 POLICYSQL_OUTCOME_UNKNOWN for a keyed atomic execute) or, when read, by the result limits (413 POLICYSQL_LIMIT_EXCEEDED). A client bytes parameter over the limit, or one that is not canonical padded base64, is a compile failure, returning 413 POLICYSQL_LIMIT_EXCEEDED / 400 POLICYSQL_INVALID_PARAMETER for an unkeyed atomic execute or Explain, and 500 POLICYSQL_OUTCOME_UNKNOWN (outcome unknown) for a keyed atomic execute, whose compile runs before the idempotency lookup. A result cell over it is 413 POLICYSQL_LIMIT_EXCEEDED and rolls back, except an atomic execute whose envelope contains a write after the first statement and whose result BLOB the streaming transport decodes over the limit; that is 500 POLICYSQL_INTERNAL (outcome unknown), because a later write may have autocommitted; a buffering provider's result encoding stays 413.
            maxRequestBytes:
              type: integer
              minimum: 1
              description: Maximum UTF-8 bytes of a request body as received, a byte order mark included. A larger body is 413 POLICYSQL_REQUEST_TOO_LARGE; for a keyed atomic execute whose retry may predate a deployment that lowered the limit it is 500 POLICYSQL_OUTCOME_UNKNOWN (outcome unknown), with nothing looked up, executed, or consumed.
            maxJsonValues:
              type: integer
              minimum: 1
              description: >-
                Maximum JSON values plus object member names in one request body, counted before the
                body is parsed; a body with more is 413 POLICYSQL_REQUEST_TOO_LARGE, or 500
                POLICYSQL_OUTCOME_UNKNOWN (outcome unknown) for a keyed atomic execute, as for
                maxRequestBytes. Counted separately on
                the result side: the raw values of the database's response to one atomic envelope or
                interactive statement, which include every cell (visibility companion cells and the check
                column of a mutation among them), every column descriptor, and every value inside a
                JSON-typed cell. A result with more is 413 POLICYSQL_LIMIT_EXCEEDED and is rolled back.
            maxResponseBytes:
              type: integer
              minimum: 1
              description: >-
                Maximum UTF-8 bytes of the complete success response of an atomic execution, plus a
                fixed 1024-byte reserve for the fields added after commit (default maxResultBytes + 65536,
                from maxResultBytes + 3072 to 589824). A response over it is 413 POLICYSQL_LIMIT_EXCEEDED,
                decided before COMMIT: the envelope is rolled back and no idempotency record is written.
                A keyed retry of a request that did commit returns its stored response, whatever the
                limit is now.
            maxSqlBytes:
              type: integer
              minimum: 1
              description: Maximum UTF-8 bytes of one statement's sql. A longer statement is 413 POLICYSQL_REQUEST_TOO_LARGE with path /statements/<i>/sql, before it is parsed; for a keyed atomic execute the compile failure is 500 POLICYSQL_OUTCOME_UNKNOWN (outcome unknown), because the compile runs before the idempotency lookup.
            maxParameters:
              type: integer
              minimum: 1
              description: >-
                Input-side limit on the distinct client parameter names of one statement (default 1024,
                at most 16384). Over it is 413 POLICYSQL_LIMIT_EXCEEDED. The limits maxParameters,
                maxExpressionDepth, maxProjections, and maxJoins bound only PolicySQL's own work on the
                client's SQL: a request within them is parsed and bound, but they do not promise that it
                compiles. Whether the emitted statement (the client's SQL composed with policy
                predicates and companion columns) fits downstream limits is decided by measuring it, and a
                statement that does not fit is 400 POLICYSQL_SQL_TOO_COMPLEX.
            maxExpressionDepth:
              type: integer
              minimum: 1
              description: Input-side limit on the binder expression depth of the client's SQL (default 32, at most 64). Over it is 413 POLICYSQL_LIMIT_EXCEEDED. See maxParameters.
            maxProjections:
              type: integer
              minimum: 1
              description: Input-side limit on the result columns of one SELECT or RETURNING in the client's SQL (default 128, at most 2000). Over it is 413 POLICYSQL_LIMIT_EXCEEDED. See maxParameters.
            maxJoins:
              type: integer
              minimum: 1
              description: Input-side limit on the joins in one FROM of the client's SQL (default 8, at most 63). Over it is 413 POLICYSQL_LIMIT_EXCEEDED. See maxParameters.
        transactions: { type: object }
        idempotency: { type: object }
    ErrorDetail:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: >-
        Machine-readable values fixed per code (ADR 0030). One key, by code: POLICYSQL_CONSTRAINT_VIOLATION
        constraint; POLICYSQL_OUTCOME_UNKNOWN cause; POLICYSQL_UNSUPPORTED_SQL feature;
        POLICYSQL_INVALID_SQL span (absent when the parser reports no position); POLICYSQL_INVALID_PARAMETER
        reason; POLICYSQL_SQL_TOO_COMPLEX complexity; POLICYSQL_EXPECTATION_FAILED expectation. Every other
        code has no detail. cause.detail never holds a cause.
      properties:
        constraint:
          type: string
          enum: [unique, not_null, foreign_key, check, other]
        feature:
          type: string
          description: The unsupported SQL construct, by its syntax (docs "detail values").
          enum: [explain, statement, constant_select, star, json_collection, delete, update, insert, insert_select, compound_select, values, distinct, window_clause, group_by, nulls_ordering, cte, derived_table, table_source, database_qualifier, indexed_by, join, self_join, window_function, subquery, expression, cast, function, literal, missing_from, duplicate_alias, duplicate_write_column, insert_arity, protected_statement]
        span:
          type: object
          additionalProperties: false
          required: [start, end]
          description: The offending token of POLICYSQL_INVALID_SQL as UTF-8 byte offsets into the statement's sql, a half-open range with start <= end.
          properties:
            start: { type: integer, minimum: 0, maximum: 1048576 }
            end: { type: integer, minimum: 0, maximum: 1048576 }
        reason:
          type: string
          enum: [positional, prefix, name, type, "null", literal, value, names]
        complexity:
          type: string
          enum: [height, recursion, columns, parameters, like_pattern, column_metadata, database_expression_depth, function_arguments, compound_terms, join_tables, database]
        expectation:
          type: string
          enum: [affectedRows, rowCount]
        cause:
          type: object
          additionalProperties: false
          required: [code, path, detail]
          description: The refusal behind POLICYSQL_OUTCOME_UNKNOWN. No code that depends on the database's state is listed.
          properties:
            code:
              type: string
              enum: [POLICYSQL_FORBIDDEN_ACCESS, POLICYSQL_STALE_OPERATION, POLICYSQL_INVALID_REQUEST, POLICYSQL_REQUEST_TOO_LARGE, POLICYSQL_JSON_TOO_DEEP, POLICYSQL_INVALID_SQL, POLICYSQL_MULTIPLE_STATEMENTS, POLICYSQL_UNSUPPORTED_SQL, POLICYSQL_MISSING_POLICY, POLICYSQL_FORBIDDEN_OPERATION, POLICYSQL_FORBIDDEN_COLUMN, POLICYSQL_FORBIDDEN_COLUMN_CONTEXT, POLICYSQL_DUPLICATE_RESULT_COLUMN, POLICYSQL_INVALID_PARAMETER, POLICYSQL_AMBIGUOUS_PARAMETER_TYPE, POLICYSQL_RESERVED_PARAMETER, POLICYSQL_PRESET_COLUMN, POLICYSQL_LIMIT_EXCEEDED, POLICYSQL_EXPECTATION_FAILED, POLICYSQL_SQL_TOO_COMPLEX, POLICYSQL_INTERNAL, POLICYSQL_DATABASE_UNAVAILABLE]
            path:
              type: [string, 'null']
              pattern: '^/statements/(0|[1-9][0-9]{0,9})(/sql)?$'
            detail:
              description: The detail of the answer the request would have had without a key; null when its code has none.
              oneOf:
                - { type: 'null' }
                - { $ref: '#/components/schemas/ErrorDetail' }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, path, requestId]
          properties:
            code:
              type: string
              pattern: '^POLICYSQL_[A-Z0-9_]+$'
              description: >-
                POLICYSQL_SQL_TOO_COMPLEX (400, path /statements/<i>, a fixed message) means the
                statement PolicySQL emitted under the active policy reached a downstream complexity
                limit (the parser's expression height or recursion depth, 2000 result columns, 32766
                host parameters, a 50000-byte LIKE or GLOB pattern, the 1 MiB column-metadata guard of
                the envelope, or a complexity refusal by the database). It is detected before COMMIT,
                so nothing was committed and the request is a rejection; an interactive transaction
                closes as failed. Retrying the same request does not help.

                POLICYSQL_CONSTRAINT_VIOLATION (409, path /statements/<i>, detail.constraint, a fixed
                message per kind) means the database refused a statement for a constraint (UNIQUE or
                PRIMARY KEY, NOT NULL, FOREIGN KEY, CHECK, a trigger's RAISE(ABORT)). It is detected
                before COMMIT while the transaction is still open and rolled back, so nothing was
                committed and the request is a rejection; an interactive transaction closes as failed.
                Exception: a schema whose ON CONFLICT ROLLBACK or RAISE(ROLLBACK) makes the database
                close the transaction is 503 POLICYSQL_DATABASE_UNAVAILABLE, and a deferred foreign
                key that fails at COMMIT is an unknown outcome.

                POLICYSQL_CHECK_FAILED (403, path /statements/<i>, no detail, a fixed message) means a
                row the statement changed does not satisfy the policy's check (the check is FALSE or
                UNKNOWN). It is detected before COMMIT and rolled back, so nothing was committed and the
                request is a rejection, with or without an Idempotency-Key; an interactive transaction
                closes as failed. A database CHECK constraint is POLICYSQL_CONSTRAINT_VIOLATION instead.

                POLICYSQL_OUTCOME_UNKNOWN (500, path null, detail.cause) means an atomic execute with an
                Idempotency-Key was refused before the database was read (a compile, the session gate,
                or a request body limit), so nothing ran and the key was not consumed, but the same
                key may have committed under an earlier deployment: the outcome is unknown, not a
                rejection. detail.cause is the code and path the request would have been refused with
                had it carried no key. Retry with the same key and body. detail.cause.detail is that
                answer's own detail, or null when its code has none.

                POLICYSQL_UNSUPPORTED_SQL (400, path /statements/<i>, detail.feature) names the SQL
                construct that is not supported, by its syntax. POLICYSQL_INVALID_SQL (400, path
                /statements/<i>, detail.span when the parser reports a position) gives the offending
                token as UTF-8 byte offsets into the statement's sql, a half-open range. POLICYSQL_INVALID_PARAMETER
                (400, path /statements/<i>, detail.reason) says why a parameter or value was refused,
                never which one. POLICYSQL_SQL_TOO_COMPLEX carries detail.complexity, the limit that was reached.
                POLICYSQL_EXPECTATION_FAILED (422) carries detail.expectation, which declared expectation
                did not hold, never the actual count. The values of detail are a fixed list, never an
                identifier, a parameter name or value, or a message of the database or the parser.
            message: { type: string }
            path: { type: [string, 'null'] }
            detail:
              $ref: '#/components/schemas/ErrorDetail'
            requestId: { type: string }
