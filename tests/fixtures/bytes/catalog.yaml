version: 1
resources:
  projects:
    source: { table: projects }
    columns:
      id: { type: string }
      tenant_id: { type: string }
      name: { type: string }
      state: { type: bytes, nullable: true }
      seed: { type: bytes }
      private_state: { type: bytes }
      forbidden: { type: bytes }
      metadata: { type: json, representation: object, storage: text }
