version: 1
resources:
  projects:
    roles:
      member:
        select:
          columns: [id, name]
          filter: { tenant_id: { eq: { session: tenant_id } } }
        # `secret` is returned on delete but is not a select column: with
        # `expect.affectedRows: 0` the probe rolls back, so the value is never shown.
        delete:
          filter: { tenant_id: { eq: { session: tenant_id } } }
          returning: { columns: [id, secret] }
