version: 1
resources:
  projects:
    roles:
      member:
        # The client `WHERE id = :id` needs `id` as an observable (select) column (issue #116).
        select:
          columns: [id, name]
          filter: { tenant_id: { eq: { session: tenant_id } } }
        update:
          columns: [name]
          presets:
            created_by: { session: subject_id }
          filter: { tenant_id: { eq: { session: tenant_id } } }
          check: { tenant_id: { eq: { session: tenant_id } } }
          returning: { columns: [id, name] }
