version: 1
resources:
  projects:
    roles:
      member:
        select:
          columns: [id, name, updated_at, touched_on, updated_ms]
          filter: { tenant_id: { eq: { session: tenant_id } } }
          limit: 100
        insert:
          columns: [id, name]
          presets:
            tenant_id: { session: tenant_id }
            updated_at: { now: {} }
            touched_on: { now: {} }
            updated_ms: { now: {} }
          check: { tenant_id: { eq: { session: tenant_id } } }
          returning: { columns: [id, name, updated_at, touched_on, updated_ms] }
        update:
          columns: [name]
          presets:
            updated_at: { now: {} }
            touched_on: { now: {} }
            updated_ms: { now: {} }
          filter: { tenant_id: { eq: { session: tenant_id } } }
          check: { tenant_id: { eq: { session: tenant_id } } }
          returning: { columns: [id, name, updated_at, touched_on, updated_ms] }
commit_checks:
  consistency:
    triggered_by: [projects]
    hook:
      timeout_ms: 1500
