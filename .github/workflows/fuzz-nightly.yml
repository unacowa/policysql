name: Fuzz (nightly)

on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch:
    inputs:
      max_size:
        description: "Layer 1: maximum SELECT size"
        required: false
        default: "5"
      t:
        description: "Layer 2: strength t"
        required: false
        default: "3"
      rounds:
        description: "Layer 2: rounds per seed"
        required: false
        default: "5"
      seed_count:
        description: "Layer 2: number of seeds"
        required: false
        default: "20"
      cases:
        description: "Layer 3: SELECT statements per seed"
        required: false
        default: "1000000"

permissions:
  contents: read

jobs:
  layers-1-2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PSQL_FUZZ_MAX_SIZE: ${{ inputs.max_size || '5' }}
      PSQL_FUZZ_MUTATION_MAX_SIZE: "4"
      PSQL_FUZZ_T: ${{ inputs.t || '3' }}
      PSQL_FUZZ_ROUNDS: ${{ inputs.rounds || '5' }}
      PSQL_FUZZ_SEED_COUNT: ${{ inputs.seed_count || '20' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p policysql-testkit --release --test noninterference -- --nocapture

  layer-3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PSQL_FUZZ_SEED_COUNT: "4"
      PSQL_FUZZ_CASES: ${{ inputs.cases || '1000000' }}
      PSQL_FUZZ_MUTATION_CASES: "200000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p policysql-testkit --release --test noninterference -- --ignored --nocapture layer3
