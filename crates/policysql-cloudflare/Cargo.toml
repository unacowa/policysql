[package]
name = "policysql-cloudflare"
description = "Versioned Rust/Wasm deployment ABI for PolicySQL on Cloudflare Workers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
policysql-catalog = { path = "../policysql-catalog" }
policysql-core = { path = "../policysql-core" }
policysql-execution = { path = "../policysql-execution" }
policysql-gateway = { path = "../policysql-gateway" }
policysql-ir = { path = "../policysql-ir" }
policysql-parser = { path = "../policysql-parser" }
policysql-policy = { path = "../policysql-policy" }
policysql-sqlite = { path = "../policysql-sqlite" }
policysql-turso = { path = "../policysql-turso" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex-lite = "0.1"
wasm-bindgen = "0.2.104"

[dev-dependencies]
serde_json = "1"
