[package]
name = "policysql-transaction"
description = "Pure PolicySQL transaction rules: canonical JSON, identities, and digests (ADR 0024)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = "1"
# `float_roundtrip`: decimals read as the correctly rounded double (ADR 0025 (b) needs
# `9007199254740991.0` to read as 2^53 - 1; the default reads it as 2^53 - 2).
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = { version = "0.10", default-features = false }

[lints]
workspace = true
