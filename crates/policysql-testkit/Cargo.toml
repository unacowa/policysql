[package]
name = "policysql-testkit"
description = "Security and differential testing helpers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
policysql-core = { path = "../policysql-core" }
policysql-execution = { path = "../policysql-execution" }
policysql-sqlite = { path = "../policysql-sqlite" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = "0.37"

[dev-dependencies]
policysql-catalog = { path = "../policysql-catalog" }
policysql-parser = { path = "../policysql-parser" }
policysql-policy = { path = "../policysql-policy" }
