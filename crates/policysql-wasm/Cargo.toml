[package]
name = "policysql-wasm"
description = "Versioned host-neutral Rust/Wasm ABI for the PolicySQL core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
policysql-catalog = { path = "../policysql-catalog" }
policysql-core = { path = "../policysql-core" }
policysql-execution = { path = "../policysql-execution" }
policysql-gateway = { path = "../policysql-gateway" }
policysql-ir = { path = "../policysql-ir" }
policysql-parser = { path = "../policysql-parser" }
policysql-policy = { path = "../policysql-policy" }
policysql-sqlite = { path = "../policysql-sqlite" }
policysql-turso = { path = "../policysql-turso" }
policysql-transaction = { path = "../policysql-transaction" }
serde = { version = "1", features = ["derive"] }
# Correctly rounded decimals, as `policysql-transaction` reads them for hashing (ADR 0025):
# without it `9007199254740991.0` reads as 9007199254740990.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
regex-lite = "0.1"
wasm-bindgen = "0.2.104"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
